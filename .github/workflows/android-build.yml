
name: Build RZ CLIENT APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Locate project and build
        shell: bash
        run: |
          echo "Procurando Gradle Wrapper..."
          find . -name gradlew -type f
          WRAPPER=$(find . -name gradlew -type f -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: gradlew não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "Projeto encontrado em: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RZ-CLIENT-APK
          path: '**/build/outputs/apk/release/*.apk'
          if-no-files-found: error
          

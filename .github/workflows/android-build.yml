
name: Build RZ CLIENT APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP do projeto não encontrado na raiz."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          WRAPPER=$(find extracted -name gradlew -type f -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "gradlew não encontrado dentro do ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RZ-CLIENT-APK
          path: extracted/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
